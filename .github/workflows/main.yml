name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # 北京时间 09:00 / 10:00 / 11:00（UTC 01:00 / 02:00 / 03:00，周一至周五）三档重试
    # arXiv 每天 20:00 ET（= 次日 00:00 UTC = 北京 08:00）才发布新论文；周五/周六晚不发。
    # 放在公告之后 1~3 小时（留足公告延迟的缓冲），且只跑周一至周五，避免周末空邮件。
    - cron: '0 1 * * 1-5'
    - cron: '0 2 * * 1-5'
    - cron: '0 3 * * 1-5'

# 同一时刻只允许一个 run 在跑：新的 run 排队等上一个结束，避免并发重复发邮件
concurrency:
  group: send-daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if already sent today
        id: sent
        run: |
          bj_today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          since=$(TZ=Asia/Shanghai date -d "${bj_today} 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          # 统计今天「真正发了邮件」的 run：只认本 workflow（main.yml），且运行时长 >15s
          # （真发送≈30s~2min，含 Zotero 拉取+RSS+重排+TLDR+发信；跳过≈7s，只跑一次 curl）。
          # 注意：去掉全文下载后真实发送已从 ~12 分钟降到 ~30 秒，阈值必须跟着降，
          # 否则永远检测不到「已发」，三档重试会重复发 3 封。
          n=$(curl -sS -G -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs" \
            --data-urlencode "created=>${since}" \
            --data-urlencode "status=success" \
            --data-urlencode "per_page=100" \
            | jq '[.workflow_runs[]
                 | select(.path == ".github/workflows/main.yml")
                 | select(((.updated_at | fromdateiso8601) - ((.run_started_at // .created_at) | fromdateiso8601)) > 15)] | length' 2>/dev/null || echo 0)
          echo "beijing today=${bj_today}, since=${since}, real sends today=${n}"
          if [ "${n}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already sent today, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.sent.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        if: steps.sent.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Run script
        if: steps.sent.outputs.skip != 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          set +e
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py 2>&1 | tee /tmp/run.log
          rc=${PIPESTATUS[0]}
          echo "::notice::script exit code = $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::SCRIPT FAILED with exit code $rc — last 80 log lines:"
            tail -80 /tmp/run.log | sed 's/^/::error::  /'
          fi
          exit $rc
